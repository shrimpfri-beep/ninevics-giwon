<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나인빅스 차량 추가</title><style>body{margin:0;background:#102d25;color:#eef5e9;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:700px;margin:8vh auto;padding:28px}section{background:#1a4234;border:1px solid #ffffff25;border-radius:20px;padding:26px}h1{line-height:1.4}input,button{font:inherit;margin:12px 0}button{background:#d7e7bd;color:#173726;border:0;padding:12px 22px;border-radius:10px;cursor:pointer}button:disabled{opacity:.4}small{color:#c4d7c4}#status{white-space:pre-wrap}</style></head><body><main><section><h1>마당에 남색 모델 Y 추가하기</h1><p>기존 기능을 유지하고 오른쪽 주차 구획에 단순화된 3D 차량을 추가합니다.</p><ol><li>직전에 받은 말풍선 버전 <code>index.html</code>을 선택하세요.</li><li>‘차량을 추가한 HTML 저장’을 누르세요.</li><li>저장한 파일로 GitHub의 <code>index.html</code>을 교체하세요.</li></ol><input type="file" id="file" accept=".html,text/html"><br><button id="save" disabled>차량을 추가한 HTML 저장</button><p id="status" role="status">파일을 선택하세요.</p><small>선택한 파일은 브라우저 안에서만 처리하며 서버로 업로드하지 않습니다. 차량은 모델 Y를 참고한 근사 모델입니다. 기존 채팅·음악·말풍선 코드는 변경하지 않습니다.</small></section></main><script>
const PATCH="\n// NINEVICS_MODEL_Y_NAVY_V1\n{ // 남색 모델 Y를 참고한 단순화된 창작 3D 차량. 정밀 CAD 모델 아님.\n const car=new THREE.Group();car.name='Navy_Model_Y';\n const paint=new THREE.MeshStandardMaterial({color:0x142c50,metalness:.65,roughness:.27,side:THREE.DoubleSide});\n const glass=new THREE.MeshStandardMaterial({color:0x182a36,metalness:.35,roughness:.16});\n const rubber=new THREE.MeshStandardMaterial({color:0x171b20,roughness:.95});\n const alloy=new THREE.MeshStandardMaterial({color:0x9da8b0,metalness:.85,roughness:.28});\n const trim=new THREE.MeshStandardMaterial({color:0x252c33,metalness:.45,roughness:.4});\n function part(geo,material,x,y,z){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;car.add(m);return m}\n function block(w,h,d,m,x,y,z){return part(new THREE.BoxGeometry(w,h,d),m,x,y,z)}\n function loft(rings,m){const positions=[],indices=[];for(const r of rings){const[z,y,width]=r;positions.push(-width,y,z,width,y,z)}for(let i=0;i<rings.length-1;i++){let a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();return part(g,m,0,0,0)}\n // 丸みのある SUV ボディー。車両前方は -Z。\n const lower=new THREE.Shape();lower.moveTo(-.85,-1.9);lower.quadraticCurveTo(-.97,-2.15,-.6,-2.2);lower.lineTo(.6,-2.2);lower.quadraticCurveTo(.97,-2.15,.88,-1.9);lower.lineTo(.94,1.8);lower.quadraticCurveTo(.92,2.1,.65,2.13);lower.lineTo(-.65,2.13);lower.quadraticCurveTo(-.92,2.1,-.94,1.8);lower.closePath();\n const baseGeo=new THREE.ExtrudeGeometry(lower,{depth:.56,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.09,bevelThickness:.08,curveSegments:12});baseGeo.rotateX(Math.PI/2);part(baseGeo,paint,0,1.02,0);\n block(1.7,.19,3.9,trim,0,.39,0);\n // 曲面のルーフと連続したガラス上面。\n loft([[-1.67,.98,.79],[-.65,1.66,.71],[.22,1.75,.7],[.9,1.61,.72],[1.8,1.02,.79]],paint);\n const sideGeo=new THREE.BufferGeometry();sideGeo.setAttribute('position',new THREE.Float32BufferAttribute([\n -.79,.99,-1.65,-.71,1.64,-.65,-.7,1.72,.22,-.72,1.59,.9,-.79,1.01,1.79,\n .79,.99,-1.65,.71,1.64,-.65,.7,1.72,.22,.72,1.59,.9,.79,1.01,1.79],3));sideGeo.setIndex([0,2,1,0,4,2,2,4,3,5,6,7,5,7,9,7,8,9]);sideGeo.computeVertexNormals();const sides=part(sideGeo,paint,0,0,0);sides.material=paint.clone();sides.material.side=THREE.DoubleSide;\n const glassMat=glass.clone();glassMat.side=THREE.DoubleSide;\n loft([[-1.49,1.09,.73],[-.67,1.644,.66]],glassMat);\n loft([[-.56,1.687,.65],[.22,1.767,.65],[.77,1.663,.66]],glassMat);\n loft([[.86,1.62,.66],[1.64,1.115,.72]],glassMat);\n for(const sign of [-1,1]){\n const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([\n sign*.793,1.105,-1.35,sign*.724,1.575,-.59,sign*.713,1.65,.21,sign*.739,1.515,.88,sign*.797,1.105,1.44],3));g.setIndex([0,1,2,0,2,4,2,3,4]);g.computeVertexNormals();part(g,glassMat,0,0,0);\n block(.018,.035,1.32,trim,sign*.81,1.078,-.56);block(.018,.035,1.5,trim,sign*.81,1.078,.87);\n block(.025,.52,.055,trim,sign*.747,1.35,.25);\n for(const z of [-.25,.94])block(.018,.033,.2,trim,sign*.945,.91,z);\n const mirror=part(new THREE.SphereGeometry(.12,12,8),paint,sign*1.025,1.18,-.83);mirror.scale.set(1.25,.55,.8);\n for(const z of [-1.37,1.37]){\n const tire=part(new THREE.CylinderGeometry(.36,.36,.24,24),rubber,sign*.91,.4,z);tire.rotation.z=Math.PI/2;\n const rim=part(new THREE.CylinderGeometry(.255,.255,.018,20),alloy,sign*1.043,.4,z);rim.rotation.z=Math.PI/2;\n const cap=part(new THREE.CylinderGeometry(.105,.105,.025,12),trim,sign*1.06,.4,z);cap.rotation.z=Math.PI/2;\n for(let k=0;k<5;k++){const a=k*Math.PI*2/5;const spoke=block(.025,.32,.055,trim,sign*1.059,.4+Math.cos(a)*.06,z+Math.sin(a)*.06);spoke.rotation.x=a;}\n }\n }\n const headlight=new THREE.MeshStandardMaterial({color:0xe5f7ff,emissive:0x99c8e0,emissiveIntensity:.7});\n const tailLight=new THREE.MeshStandardMaterial({color:0x9d1d2b,emissive:0x650b15,emissiveIntensity:.5});\n for(const x of [-.65,.65]){const h=block(.37,.065,.055,headlight,x,.94,-2.18);h.rotation.z=x<0?-.1:.1;block(.4,.065,.055,tailLight,x,.99,2.17);}\n block(1.3,.1,.06,trim,0,.54,-2.23);block(.45,.14,.035,alloy,0,.66,2.24);\n // 小さい銀色の T 型エンブレム。\n block(.1,.012,.015,alloy,0,1.04,-2.13);block(.012,.055,.015,alloy,0,1.014,-2.14);\n car.position.set(8.7,.12,7.3);car.rotation.y=-.15;scene.add(car);\n // 주차 구획: 방석에서 떨어진 오른쪽 마당.\n const parking=new THREE.Group();parking.position.set(8.7,.12,7.3);parking.rotation.y=-.15;\n const lineMat=new THREE.MeshStandardMaterial({color:0xeee9cf,roughness:1});\n for(const x of [-1.45,1.45]){const m=new THREE.Mesh(new THREE.BoxGeometry(.055,.012,5.4),lineMat);m.position.set(x,.01,0);parking.add(m)}\n const end=new THREE.Mesh(new THREE.BoxGeometry(2.95,.012,.055),lineMat);end.position.set(0,.01,2.7);parking.add(end);scene.add(parking);\n}\n";let result='';const file=document.getElementById('file'),save=document.getElementById('save'),status=document.getElementById('status');
file.onchange=async()=>{save.disabled=true;result='';const f=file.files[0];if(!f)return;try{const text=await f.text();if(text.includes('NINEVICS_MODEL_Y_NAVY_V1')){status.textContent='이미 차량이 추가된 파일입니다. 중복으로 추가하지 않습니다.';return}const re=/<script\b[^>]*type=["']module["'][^>]*>([\s\S]*?)<\/script\s*>/gi;let m,target=null;while((m=re.exec(text))!==null){if(m[1].includes('THREE.Scene')&&m[1].includes("from 'three'")){target=m;break}}if(!target){status.textContent='호환되는 Three.js 모듈을 찾지 못했습니다. 직전에 제공한 말풍선 버전 index.html을 선택해주세요.';return}const original=target[0];const changed=original.replace(/<\/script\s*>$/i,PATCH+'<'+ '/script>');result=text.slice(0,target.index)+changed+text.slice(target.index+original.length);save.disabled=false;status.textContent='차량 추가 준비 완료. 저장 버튼을 눌러 새 index.html을 받으세요.'}catch(e){status.textContent='파일 처리 실패: '+e.message}};
save.onclick=()=>{if(!result)return;const blob=new Blob([result],{type:'text/html;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);status.textContent='새 HTML 저장을 요청했습니다. 기존 파일과 이름이 겹치면 index (1).html로 저장될 수 있습니다. GitHub에는 index.html로 올려주세요.'};
</script></body></html>
